 [{"name": "PRIMARY KEY", "kind": "PRIMARY KEY", "columns": ["user_ID", "product_ID"]}, {"name": "fk_products3", "kind": "KEY", "columns": ["product_ID"]}], "foreignKeys": [{"name": "fk_products3", "columns": ["product_ID"], "refTable": "tb_products", "refColumns": ["id"], "onDelete": null, "onUpdate": null}, {"name": "fk_user2", "columns": ["user_ID"], "refTable": "tb_users", "refColumns": ["id"], "onDelete": null, "onUpdate": null}], "rowCount": 0}], "routines": [{"name": "sp_generate_test_users", "type": "PROCEDURE", "definer": "root@localhost", "parameters": [{"mode": "IN", "name": "p_scenario", "type": "VARCHAR(20)"}, {"mode": "IN", "name": "p_password", "type": "VARCHAR(255)"}], "impactedTables": ["tb_people", "tb_users"], "transactionHandling": true, "source": "CREATE DEFINER=`root`@`localhost` PROCEDURE `sp_generate_test_users`(\n    IN p_scenario VARCHAR(20),\n    IN p_password VARCHAR(255)\n)\nBEGIN\n    DECLARE v_total INT DEFAULT 0;\n    DECLARE v_i INT DEFAULT 0;\n    DECLARE v_user_id INT UNSIGNED;\n    DECLARE v_status BIT(1);\n    DECLARE v_country CHAR(2);\n    DECLARE v_gender VARCHAR(30);\n    DECLARE v_age INT;\n    DECLARE v_birth_date DATE;\n    DECLARE v_given_names VARCHAR(150);\n    DECLARE v_family_names VARCHAR(150);\n    DECLARE v_email VARCHAR(100);\n    DECLARE v_nick VARCHAR(50);\n    DECLARE v_unique VARCHAR(32);\n\n    DECLARE EXIT HANDLER FOR SQLEXCEPTION\n    BEGIN\n        ROLLBACK;\n        RESIGNAL;\n    END;\n\n    IF p_password IS NULL OR CHAR_LENGTH(p_password) < 8 THEN\n        SIGNAL SQLSTATE '45000'\n        SET MESSAGE_TEXT = 'La contraseña debe tener al menos 8 caracteres';\n    END IF;\n\n    CASE p_scenario\n        WHEN 'escenario_1' THEN SET v_total = 500;\n        WHEN 'escenario_2' THEN SET v_total = 2000;\n        WHEN 'escenario_3' THEN SET v_total = 5000;\n        ELSE\n            SIGNAL SQLSTATE '45000'\n            SET MESSAGE_TEXT = 'Usa escenario_1, escenario_2 o escenario_3';\n    END CASE;\n\n    START TRANSACTION;\n\n    WHILE v_i < v_total DO\n        SET v_i = v_i + 1;\n\n        \n        IF p_scenario = 'escenario_3' AND v_i > 4000 THEN\n            SET v_status = b'0';\n        ELSE\n            SET v_status = b'1';\n        END IF;\n\n        \n        IF p_scenario = 'escenario_1' THEN\n            SET v_country = 'US';\n        ELSE\n            SET v_country = ELT(\n                1 + FLOOR(RAND() * 10),\n                'MX', 'CA', 'GB', 'FR', 'DE',\n                'ES', 'BR', 'JP', 'AU', 'IN'\n            );\n        END IF;\n\n        \n        IF p_scenario = 'escenario_2' THEN\n            SET v_age = 19 + FLOOR(RAND() * 17);\n        ELSE\n            SET v_age = 18 + FLOOR(RAND() * 48);\n        END IF;\n\n        SET v_birth_date = DATE_SUB(CURDATE(), INTERVAL v_age YEAR) - INTERVAL FLOOR(RAND() * 365) DAY;\n\n        \n        SET v_given_names = ELT(\n            1 + FLOOR(RAND() * 30),\n            'Carlos', 'Maria', 'Jose', 'Ana', 'Luis',\n            'Sofia', 'Miguel', 'Lucia', 'Diego', 'Valeria',\n            'Daniel', 'Gabriela', 'Alejandro', 'Camila',\n            'Fernando', 'Isabella', 'Ricardo', 'Elena',\n            'Andres', 'Natalia', 'James', 'Emily',\n            'William', 'Olivia', 'Benjamin', 'Charlotte',\n            'Noah', 'Amelia', 'Lucas', 'Emma'\n        );\n\n        \n        SET v_family_names = ELT(\n            1 + FLOOR(RAND() * 30),\n            'Hernandez', 'Garcia', 'Martinez', 'Lopez',\n            'Gonzalez', 'Rodriguez', 'Perez', 'Sanchez',\n            'Ramirez', 'Torres', 'Flores', 'Rivera',\n            'Gomez', 'Diaz', 'Cruz', 'Morales',\n            'Reyes', 'Ortiz', 'Gutierrez', 'Castillo',\n            'Smith', 'Johnson', 'Brown', 'Williams',\n            'Jones', 'Miller', 'Davis', 'Wilson',\n            'Anderson', 'Taylor'\n        );\n\n        \n        IF p_scenario = 'escenario_1' THEN\n            SET v_gender = 'Hombre';\n        ELSE\n            SET v_gender = ELT(\n                1 + FLOOR(
