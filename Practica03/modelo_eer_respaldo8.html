function applyFilters(){const q=filterText.trim().toLowerCase();let visible=0;for(const g of graph.querySelectorAll('.entity')){const t=byName.get(g.dataset.table);let ok=true;if(q&&!t.name.toLowerCase().includes(q)&&!t.columns.some(c=>c.name.toLowerCase().includes(q)))ok=false;if(document.getElementById('relatedOnly').checked&&selected&&t.name!==selected&&!M.foreign_keys.some(f=>(f.table===selected&&f.target===t.name)||(f.target===selected&&f.table===t.name))&&!M.inferred_relations.some(f=>(f.source_table===selected&&f.target_table===t.name)||(f.target_table===selected&&f.source_table===t.name)))ok=false;if(document.getElementById('pkOnly').checked&&!t.columns.some(c=>c.constraints.some(k=>k.constraint==='PRIMARY')))ok=false;if(document.getElementById('fkOnly').checked&&!t.columns.some(c=>c.constraints.some(k=>k.referenced_table)))ok=false;if(document.getElementById('indexOnly').checked&&!t.indexes.length)ok=false;g.classList.toggle('filtered',!ok);const topNames=new Set([...M.tables].sort((a,b)=>b.row_count-a.row_count).slice(0,3).map(x=>x.name));g.classList.toggle('topCount',document.getElementById('countSort').checked&&topNames.has(t.name));if(ok)visible++}document.getElementById('resultCount').textContent=q?`${visible} tablas · ${M.tables.filter(t=>t.name.toLowerCase().includes(q)||t.columns.some(c=>c.name.toLowerCase().includes(q))).length} coincidencias`:'';}
function value(v){return v===null?'No definido en el respaldo':esc(v)}function showDetail(name){const t=byName.get(name);if(!t)return;const side=document.getElementById('side');side.classList.remove('closed');const fks=M.foreign_keys.filter(f=>f.table===name||f.target===name),inf=M.inferred_relations.filter(f=>f.source_table===name||f.target_table===name);const colHtml=t.columns.map(c=>{const roles=[];if(c.constraints.some(k=>k.constraint==='PRIMARY'))roles.push('PK');if(c.constraints.some(k=>k.referenced_table))roles.push('FK');if(c.indexes.some(i=>i.non_unique===0&&i.name!=='PRIMARY'))roles.push('UNIQUE');const refs=c.constraints.filter(k=>k.referenced_table).map(k=>`${k.referenced_table}.${k.referenced_column} (${k.constraint})`);const indexNames=[...new Set(c.indexes.map(i=>`${i.name}${i.non_unique===0?' · único':''}`))];return `<div class="col" id="col-${safe(name)}-${safe(c.name)}"><div class="coltop"><span>${esc(c.name)}</span><span>${roles.map(r=>`<i class="badge">${r}</i>`).join(' ')}</span></div><div class="coltype">${esc(c.type)}</div><div class="props"><span>Nulabilidad</span><b>${esc(c.nullable)}</b><span>Predeterminado</span><b>${c.default_sql ? esc(c.default_sql) : value(c.default)}</b><span>Generación</span><b>${c.extra||'No definido en el respaldo'}</b><span>Expresión generada</span><b>${c.generated||'No definido en el respaldo'}</b><span>Juego / colación</span><b>${c.charset||'No aplica / no definido'} · ${c.collation||'No definido'}</b><span>Restricciones</span><b>${[...c.constraints.map(k=>k.constraint),...refs].join('; ')||'No definido en el respaldo'}</b><span>Índices</span><b>${indexNames.join('; ')||'No definido en el respaldo'}</b><span>Comentario</span><b>${c.comment||'No definido en el respaldo'}</b><span>SQL original</span><b>${value(c.sql_definition)}</b></div></div>`}).join('');document.getElementById('detail').innerHTML=`<div class="detail-head"><div><h2>${esc(name)}</h2><div class="tag">${t.row_count.toLocaleString('es-MX')} filas verificadas · ${t.columns.length} columnas</div></div><button id="closeSide" aria-label="Cerrar detalles">×</button></div><div class="section"><h3>Tabla física</h3><div class="props"><span>Motor</span><b>${value(t.engine)}</b><span>Colación</span><b>${value(t.collation)}</b><span>Descripción</span><b>${value(t.comment)}</b><span>Índices</span><b>${[...new Set(t.indexes.map(i=>`${i.name} (${i.columns?.join(', ')||''})${i.unique?' UNIQUE':''}`))].join('; ')||'Sin índices declarados aparte de PRIMARY'}</b><span>Clasificación EER</span><b>${name.startsWith('tbd_')?'Asociativa por PK compuesta y FK (estructural)':'Entidad sin subclase inferida'}</b></div></div><div class="section"><h3>Columnas completas (${t.columns.length})</h3><div class="cols">${colHtml}</div></div><div class="section"><h3>Relaciones declaradas</h3>${fks.length?fks.map(f=>`<div class="rel">${esc(f.table)}.${esc(f.columns.map(c=>c.column).join(', '))} → ${esc(f.target)}.${esc(f.columns.map(c=>c.referenced_column).join(', '))}<br><span class="small">${esc(f.name)} · ON DELETE ${esc(f.delete_rule||'NO ACTION')} · ON UPDATE ${esc(f.update_rule||'NO ACTION')}</span></div>`).join(''):'<div class="small">Sin claves foráneas declaradas.</div>'}${inf.map(r=>`<div class="rel">Inferida; FK no declarada: ${esc(r.source_table)}.${esc(r.source_column)} → ${esc(r.target_table)}<br><span class="small">${esc(r.evidence)}</span></div>`).join('')}</div>`;document.getElementById('closeSide').onclick=()=>side.classList.add('closed');}

function showResults(){const q=document.getElementById('search').value.toLowerCase().trim(),box=document.getElementById('results');filterText=q;applyFilters();if(!q){box.style.display='none';return}const hits=[];for(const t of M.tables){if(t.name.toLowerCase().includes(q))hits.push({t,c:null});for(const c of t.columns)if(c.name.toLowerCase().includes(q))hits.push({t,c})}document.getElementById('resultCount').textContent=`${hits.length} coincidencias`;box.innerHTML=hits.slice(0,50).map((h,i)=>`<div class="result" data-hit="${i}"><b>${esc(h.t.name)}</b>${h.c?`<span class="small"> · ${esc(h.c.name)} (${esc(h.c.type)})</span>`:'<span class="small"> · tabla</span>'}</div>`).join('')||'<div class="result">Sin coincidencias</div>';box.style.display='block';box.querySelectorAll('[data-hit]').forEach((e,i)=>e.onclick=()=>{const h=hits[i];focusColumn(h.t,h.c);showDetail(h.t.name);const [x,y]=positions[h.t.name];panX=canvas.clientWidth/2-(x+150)*scale;panY=canvas.clientHeight/2-(y+25)*scale;box.style.display='none';draw();if(h.c)document.getElementById(`col-${safe(h.t.name)}-${safe(h.c.name)}`)?.scrollIntoView({block:'center',behavior:anim?'smooth':'instant'})});}
document.getElementById('search').addEventListener('input',showResults);for(const id of ['relatedOnly','pkOnly','fkOnly','indexOnly','inferToggle'])document.getElementById(id).onchange=()=>{draw();applyFilters()};document.getElementById('countSort').onchange=()=>applyFilters();document.getElementById('zoomIn').onclick=()=>{scale=Math.min(2.5,scale*1.2);draw()};document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.25,scale/1.2);draw()};document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=reset;document.getElementById('motion').onclick=e=>{anim=!anim;document.body.classList.toggle('still',!anim);e.currentTarget.textContent=`Animacion: ${anim?'activa':'desactivada'}`};document.getElementById('openSide').onclick=()=>document.getElementById('side').classList.toggle('closed');document.getElementById('theme').onclick=()=>{const light=document.body.classList.toggle('light');if(light){document.documentElement.style.setProperty('--bg','#eef4f8');document.documentElement.style.setProperty('--panel','#fff');document.documentElement.style.setProperty('--panel2','#e4edf5');document.documentElement.style.setProperty('--line','#c6d5e2');document.documentElement.style.setProperty('--text','#132238');document.documentElement.style.setProperty('--muted','#53687d');document.documentElement.style.colorScheme='light'}else{location.reload()}};canvas.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.25,Math.min(2.5,scale*(e.deltaY<0?1.1:.9)));draw()},{passive:false});let pan=null;canvas.addEventListener('pointerdown',e=>{if(!e.target.closest('.entity,.edge')&&(e.target===graph||e.target===canvas||e.target.closest('svg'))){pan=[e.clientX,e.clientY,panX,panY];graph.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(pan){panX=pan[2]+e.clientX-pan[0];panY=pan[3]+e.clientY-pan[1];draw()}});canvas.addEventListener('pointerup',()=>pan=null);document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('results').style.display='none'});const sum=document.getElementById('summary');[[M.tables.length,'Tablas fisicas'],[M.summary.verified_foreign_key_constraints,'FK verificadas'],[M.summary.columns,'Columnas'],[M.summary.verified_tables,'Conteos verificados'],[M.summary.sum_of_rows_not_unique_entities.toLocaleString('es-MX'),'Suma de filas (no entidades únicas)'],[`${M.views.length} vistas · ${M.triggers.length} triggers`,'Objetos adicionales']].forEach(([n,l])=>sum.insertAdjacentHTML('beforeend',`<div class="metric"><b>${n}</b><span>${l}</span></div>`));draw();setTimeout(fit,80);</script></body></html>
